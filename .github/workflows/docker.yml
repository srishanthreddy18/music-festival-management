name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Backend JAR
        run: |
          cd CrudService
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t srishanthreddy18/music-festival-backend:latest ./CrudService

      - name: Push Backend Image
        run: |
          docker push srishanthreddy18/music-festival-backend:latest

      - name: Build Frontend Image
        run: |
          docker build -t srishanthreddy18/music-festival-frontend:latest ./musicfestival-frontend

      - name: Push Frontend Image
        run: |
          docker push srishanthreddy18/music-festival-frontend:latest