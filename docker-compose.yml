services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: exam_2400031485
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - music-festival-net

  backend:
    image: srishanthreddy18/music-festival-backend:latest
    container_name: backend-container
    ports:
      - "9090:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/exam_2400031485
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - music-festival-net

  frontend:
    image: srishanthreddy18/music-festival-frontend:latest
    build: ./musicfestival-frontend
    container_name: frontend-container
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - music-festival-net

volumes:
  postgres_data:

networks:
  music-festival-net:
    driver: bridge